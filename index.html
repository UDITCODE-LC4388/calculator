<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, high-precision luxury calculator featuring glassmorphism design, history logging, memory functions, scientific mode, tactile audio feedback, and full keyboard navigation.">
  <meta name="theme-color" content="#0b0f19">
  <title>AuraCalc — Modern Precision Calculator</title>

  <!-- Google Fonts: Outfit for clean UI & JetBrains Mono for crisp digital numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="obsidian">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="app-container" id="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </span>
        <h1 class="brand-title">AuraCalc</h1>
        <span class="brand-tag" id="mode-badge">Standard</span>
      </div>

      <div class="header-controls">
        <!-- Sound toggle -->
        <button class="icon-btn" id="btn-toggle-sound" title="Toggle Sound Feedback (Mute/Unmute)" aria-label="Toggle Sound">
          <svg class="icon-sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="icon-sound-off hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme selector button -->
        <button class="icon-btn" id="btn-theme-toggle" title="Switch Theme (Obsidian, Cyber Neon, Aurora, Moonlight)" aria-label="Switch Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- History toggle -->
        <button class="icon-btn" id="btn-toggle-history" title="Toggle History Drawer" aria-label="Toggle History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="12 8 12 12 14 14"></polyline>
            <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Calculator Card -->
    <div class="calculator-card" id="calculator-card">
      
      <!-- Display Section -->
      <section class="calc-display-section" id="calc-display-section" aria-live="polite">
        <!-- Status Row: Memory Indicator, Angle Mode, Copy feedback -->
        <div class="display-status-bar">
          <div class="status-indicators">
            <span class="status-pill hidden" id="memory-indicator">M</span>
            <span class="status-pill hidden" id="rad-deg-indicator">DEG</span>
          </div>
          <button class="copy-btn" id="btn-copy" title="Copy current value" aria-label="Copy display value">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-label">Copy</span>
          </button>
        </div>

        <!-- Expression history line -->
        <div class="expression-line" id="expression-display" title="Current Calculation Expression">&nbsp;</div>

        <!-- Main Display line with adaptive scaling -->
        <div class="main-display-container">
          <div class="main-display" id="main-display">0</div>
        </div>
      </section>

      <!-- Sub-toolbar: Memory and Mode Controls -->
      <div class="calc-subnav">
        <div class="memory-bar">
          <button class="mem-btn" id="btn-mc" data-mem="MC" title="Memory Clear">MC</button>
          <button class="mem-btn" id="btn-mr" data-mem="MR" title="Memory Recall">MR</button>
          <button class="mem-btn" id="btn-mplus" data-mem="M+" title="Memory Add">M+</button>
          <button class="mem-btn" id="btn-mminus" data-mem="M-" title="Memory Subtract">M−</button>
          <button class="mem-btn" id="btn-ms" data-mem="MS" title="Memory Store">MS</button>
        </div>
        <button class="mode-toggle-btn" id="btn-toggle-scientific" title="Toggle Scientific Functions">
          <span>fx</span>
          <svg class="chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Scientific Panel (Collapsible / Expandable) -->
      <div class="scientific-panel collapsed" id="scientific-panel">
        <div class="sci-grid">
          <button class="calc-btn sci-btn" data-action="sci" data-fn="rad-deg" id="btn-angle-unit">DEG</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="sin">sin</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="cos">cos</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="tan">tan</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="pi">π</button>

          <button class="calc-btn sci-btn" data-action="sci" data-fn="paren-open">(</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="paren-close">)</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="pow">xʸ</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="sqrt">√x</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="square">x²</button>

          <button class="calc-btn sci-btn" data-action="sci" data-fn="fact">x!</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="ln">ln</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="log">log</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="inv">1/x</button>
          <button class="calc-btn sci-btn" data-action="sci" data-fn="e">e</button>
        </div>
      </div>

      <!-- Main Standard Keypad Grid -->
      <div class="keypad-grid" id="keypad-grid">
        <!-- Row 1 -->
        <button class="calc-btn fn-btn" data-action="clear" id="key-ac" title="Clear Display (Esc)">AC</button>
        <button class="calc-btn fn-btn" data-action="backspace" id="key-backspace" title="Delete Last Digit (Backspace)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="calc-btn fn-btn" data-action="percent" id="key-percent" title="Percentage (%)">%</button>
        <button class="calc-btn op-btn" data-action="operator" data-op="÷" id="key-divide" title="Divide (/)">÷</button>

        <!-- Row 2 -->
        <button class="calc-btn num-btn" data-action="number" data-num="7" id="key-7">7</button>
        <button class="calc-btn num-btn" data-action="number" data-num="8" id="key-8">8</button>
        <button class="calc-btn num-btn" data-action="number" data-num="9" id="key-9">9</button>
        <button class="calc-btn op-btn" data-action="operator" data-op="×" id="key-multiply" title="Multiply (*)">×</button>

        <!-- Row 3 -->
        <button class="calc-btn num-btn" data-action="number" data-num="4" id="key-4">4</button>
        <button class="calc-btn num-btn" data-action="number" data-num="5" id="key-5">5</button>
        <button class="calc-btn num-btn" data-action="number" data-num="6" id="key-6">6</button>
        <button class="calc-btn op-btn" data-action="operator" data-op="−" id="key-subtract" title="Subtract (-)">−</button>

        <!-- Row 4 -->
        <button class="calc-btn num-btn" data-action="number" data-num="1" id="key-1">1</button>
        <button class="calc-btn num-btn" data-action="number" data-num="2" id="key-2">2</button>
        <button class="calc-btn num-btn" data-action="number" data-num="3" id="key-3">3</button>
        <button class="calc-btn op-btn" data-action="operator" data-op="+" id="key-add" title="Add (+)">+</button>

        <!-- Row 5 -->
        <button class="calc-btn fn-btn" data-action="negate" id="key-negate" title="Toggle Positive/Negative (±)">±</button>
        <button class="calc-btn num-btn" data-action="number" data-num="0" id="key-0">0</button>
        <button class="calc-btn num-btn" data-action="decimal" id="key-decimal" title="Decimal Point (.)">.</button>
        <button class="calc-btn equals-btn" data-action="equals" id="key-equals" title="Calculate Result (= or Enter)">=</button>
      </div>

    </div>

    <!-- Keyboard Shortcuts Guide Hint -->
    <footer class="app-footer">
      <div class="shortcut-tip">
        <span class="key-badge">Enter</span> to calculate &bull;
        <span class="key-badge">Esc</span> clear &bull;
        <span class="key-badge">⌫</span> delete &bull;
        <span class="key-badge">Numpad</span> supported
      </div>
    </footer>
  </main>

  <!-- History Slide-over Drawer -->
  <aside class="history-drawer" id="history-drawer" aria-label="Calculation History">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="12 8 12 12 14 14"></polyline>
          <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
        </svg>
        <h3>Calculation History</h3>
      </div>
      <button class="icon-btn" id="btn-close-history" title="Close History" aria-label="Close history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="history-list" id="history-list">
      <!-- Populated via JS -->
      <div class="history-empty">
        <p>No calculation history yet.</p>
        <span>Perform calculations to see them logged here.</span>
      </div>
    </div>

    <div class="drawer-footer">
      <button class="clear-history-btn" id="btn-clear-history">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear History
      </button>
    </div>
  </aside>

  <!-- Backdrop overlay when drawer is open on small screens -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Toast Notification element -->
  <div class="toast-notification" id="toast-notification" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
